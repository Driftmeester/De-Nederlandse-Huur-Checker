<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Huur-checker | Bereken je maximale huur in Nederland</title>
  <meta name="description" content="Ontdek snel wat je maximale huur kan zijn op basis van je inkomen en vaste lasten. Gratis online huurcheck.">
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--accent:#2563eb;--muted:#6b7280;--bar-bg:#e5e7eb}
    body{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial; background:var(--bg); padding:32px}
    .container{max-width:900px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
    h1{font-size:20px;margin:0}
    .card{background:var(--card);padding:20px;border-radius:12px;box-shadow:0 6px 18px rgba(20,20,50,.06)}
    form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input[type='number'], select{width:100%;padding:10px;border-radius:8px;border:1px solid #e6e9ef;font-size:15px}
    .full{grid-column:1 / -1}
    .actions{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
    button{background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;border:0;cursor:pointer}
    .result{margin-top:14px;padding:16px;border-radius:10px;background:linear-gradient(90deg,#f8fafc,#ffffff)}
    .small{font-size:13px;color:var(--muted)}
    .flex{display:flex;gap:12px;align-items:center}
    .pill{background:#eef2ff;color:#1e3a8a;padding:6px 10px;border-radius:999px;font-weight:600}
    footer{margin-top:12px;font-size:13px;color:var(--muted)}
    .hidden{display:none}
    .risk-bar-container{background:var(--bar-bg);border-radius:8px;height:20px;overflow:hidden;margin-top:12px}
    .risk-bar{height:100%;transition:width 0.5s;}
    .risk-text{margin-top:8px;font-size:13px;color:var(--muted)}
    .flag-btn{width:32px;height:20px;cursor:pointer; border:1px solid #ccc; border-radius:4px;}
    @media (max-width:700px){form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="pageTitle">Huur-checker — Controleer of je een woning kunt huren</h1>
      <div class="small" id="pageSubtitle">Prototype • Nederlands</div>
      <div style="display:flex;gap:5px;align-items:center;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/Flag_of_the_Netherlands.svg" alt="NL" class="flag-btn" id="btnNL">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/ae/Flag_of_the_United_Kingdom.svg" alt="EN" class="flag-btn" id="btnEN">
      </div>
    </header>

    <section class="card">
      <form id="calcForm">
        <div>
          <label id="labelIncome" for="income">Maandelijks netto-inkomen (jij) €</label>
          <input id="income" type="number" min="0" step="0.01" value="2000">
        </div>
        <div>
          <label id="labelPartnerIncome" for="partnerIncome">Maandelijks netto-inkomen (partner) €</label>
          <input id="partnerIncome" type="number" min="0" step="0.01" value="0">
        </div>
        <div>
          <label id="labelOtherIncome" for="otherIncome">Overige maandelijkse inkomsten €</label>
          <input id="otherIncome" type="number" min="0" step="0.01" value="0">
        </div>
        <div>
          <label id="labelExpenses1">Vaste maandelijkse uitgaven (GWL, Verzekeringen, Benzine, Belastingen) €</label>
          <input id="fixedExpensesGWLIG" type="number" min="0" step="0.01" value="400">
        </div>
        <div>
          <label id="labelExpenses2">Vaste maandelijkse uitgaven (Abonnementen) €</label>
          <input id="fixedExpensesSubs" type="number" min="0" step="0.01" value="400">
        </div>
        <div>
          <label id="labelExpenses3">Vaste maandelijkse uitgaven (Uitjes / Leuke dingen doen / Overig) €</label>
          <input id="fixedExpensesFUN" type="number" min="0" step="0.01" value="400">
        </div>
        <div>
          <label id="labelDebtPayments" for="debtPayments">Maandelijkse (minimum) aflossingen / leningen - inclusief DUO €</label>
          <input id="debtPayments" type="number" min="0" step="0.01" value="100">
        </div>
        <div>
          <label id="labelSavings" for="savingsGoal">Gewenste maandelijkse spaargeld (buffer) €</label>
          <input id="savingsGoal" type="number" min="0" step="0.01" value="200">
        </div>
        <input id="desiredShare" type="hidden" value="33">
      
        <div class="full actions">
          <button type="button" id="calculate">Bereken</button>
          <button type="button" id="reset">Reset</button>
          <div class="small" id="calcInfo">Resultaat gebaseerd op eenvoudige regels. Zie uitleg onderaan.</div>
        </div>

        <div id="resultArea" class="full" hidden>
          <div class="result">
            <div class="flex">
              <div>
                <div class="small" id="labelTotalIncome">Totale netto-inkomsten</div>
                <div id="totalIncome" style="font-size:18px;font-weight:700">€0</div>
              </div>
              <div style="margin-left:auto;text-align:right">
                <div class="small" id="labelRecommendedRent">Aanbevolen maximale huur</div>
                <div id="recommendedRent" style="font-size:22px;font-weight:800" class="pill">€0</div>
              </div>
            </div>

            <div class="risk-bar-container">
              <div id="riskBar" class="risk-bar" style="width:100%; background:green;"></div>
            </div>
            <div id="riskText" class="risk-text"></div>

            <hr style="margin:12px 0;border:none;border-top:1px solid #eef2f6">

            <div class="small" id="calcDetailsLabel">Berekening:</div>
            <ul>
              <li id="calcDetail1"></li>
              <li id="calcDetail2"></li>
              <li id="calcDetail3"></li>
            </ul>
          </div>
        </div>
      </form>

      <footer>
        <p id="footerText"></p>
      </footer>
    </section>
  </div>

  <script>
    let currentLang = 'nl';
    const translations = {
      nl:{
        pageTitle:'Huur-checker — Controleer of je een woning kunt huren',
        pageSubtitle:'Prototype • Nederlands',
        labelIncome:'Maandelijks netto-inkomen (jij) €',
        labelPartnerIncome:'Maandelijks netto-inkomen (partner) €',
        labelOtherIncome:'Overige maandelijkse inkomsten €',
        labelExpenses1:'Vaste maandelijkse uitgaven (GWL, Verzekeringen, Benzine, Belastingen) €',
        labelExpenses2:'Vaste maandelijkse uitgaven (Abonnementen) €',
        labelExpenses3:'Vaste maandelijkse uitgaven (Uitjes / Leuke dingen doen / Overig) €',
        labelDebtPayments:'Maandelijkse (minimum) aflossingen / leningen - inclusief DUO €',
        labelSavings:'Gewenste maandelijkse spaargeld (buffer) €',
        calculate:'Bereken',
        reset:'Reset',
        calcInfo:'Resultaat gebaseerd op eenvoudige regels. Zie uitleg onderaan.',
        labelTotalIncome:'Totale netto-inkomsten',
        labelRecommendedRent:'Aanbevolen maximale huur',
        calcDetailsLabel:'Berekening:',
        footerText:`Deze prototype gebruikt twee maatstaven en kiest de meest conservatieve waarde:
        <ol>
          <li>Maximale huur op basis van percentage van totale netto-inkomsten (standaard 33%).</li>
          <li>Maximale huur op basis van resterend inkomen: (inkomen - vaste lasten - schulden - spaargeld) × 50%.</li>
        </ol>
        De reden: een vuistregel is dat huur ongeveer 30–35% van je netto-inkomen mag zijn. Maar als je veel vaste lasten of schulden hebt, is het veiliger om te kijken naar wat er echt overblijft na die lasten.`
      },
      en:{
        pageTitle:'Rent Checker — Calculate if you can rent a house',
        pageSubtitle:'Prototype • English',
        labelIncome:'Monthly net income (you) €',
        labelPartnerIncome:'Monthly net income (partner) €',
        labelOtherIncome:'Other monthly income €',
        labelExpenses1:'Fixed monthly expenses (utilities, insurance, fuel, taxes) €',
        labelExpenses2:'Fixed monthly expenses (subscriptions) €',
        labelExpenses3:'Fixed monthly expenses (leisure / fun / other) €',
        labelDebtPayments:'Monthly (minimum) loan payments, including DUO €',
        labelSavings:'Desired monthly savings (buffer) €',
        calculate:'Calculate',
        reset:'Reset',
        calcInfo:'Result based on simple rules. See explanation below.',
        labelTotalIncome:'Total net income',
        labelRecommendedRent:'Recommended maximum rent',
        calcDetailsLabel:'Calculation:',
        footerText:`This prototype uses two measures and chooses the most conservative value:
        <ol>
          <li>Maximum rent based on percentage of total net income (standard 33%).</li>
          <li>Maximum rent based on disposable income: (income - fixed expenses - debts - savings) × 50%.</li>
        </ol>
        Rent should typically be about 30–35% of your net income. If you have high fixed expenses or debts, it is safer to consider what remains after these expenses.`
      }
    };

    function translatePage(lang){
      currentLang = lang;
      for(const key in translations[lang]){
        const el = document.getElementById(key);
        if(el) el.innerHTML = translations[lang][key];
      }
    }

    document.getElementById('btnNL').addEventListener('click', ()=>translatePage('nl'));
    document.getElementById('btnEN').addEventListener('click', ()=>translatePage('en'));

    function formatEur(n){ return new Intl.NumberFormat('nl-NL', {style:'currency', currency:'EUR', maximumFractionDigits:0}).format(n); }

    function compute(values){
      const totalIncome = values.income + values.partnerIncome + values.otherIncome;
      const fixedExpenses = (values.fixedExpensesGWLIG || 0) + (values.fixedExpensesSubs || 0) + (values.fixedExpensesFUN || 0);
      const disposable = totalIncome - fixedExpenses - values.debtPayments - values.savingsGoal;
      const rentByIncome = totalIncome * (values.desiredShare / 100);
      const rentByDisposable = Math.max(0, disposable * 0.5);
      const recommended = Math.min(rentByIncome, rentByDisposable);
      return { totalIncome, rentByIncome, disposable, rentByDisposable, recommended };
    }

    function getRiskColorAndText(rent, lang='nl'){
      let color, text;
      if(rent < 750) color = 'red';
      else if(rent < 1100) color = 'orange';
      else color = 'green';

      if(lang==='en'){
        if(color==='red') text = 'Red: Your income is too low, or your expenses are too high to comfortably rent.';
        else if(color==='orange') text = 'Orange: You can rent, but financial setbacks may be harder to handle due to limited savings. Large expenses such as cars or vacations may be difficult.';
        else text = 'Green: You can comfortably rent. You can save for potential financial setbacks.';
      } else {
        if(color==='red') text = 'Rood: Je inkomen is te laag, of je uitgaven zijn te hoog om comfortabel te huren.';
        else if(color==='orange') text = 'Oranje: Je kan huren, let wel op dat financiële tegenslagen misschien moeilijker zijn om te incasseren omdat je minder kan sparen. Grote uitgaven zoals voertuigen of vakanties zijn ook moeilijker.';
        else text = 'Groen: Je kan prima huren. Voor eventuele financiële tegenslagen kan je gewoon sparen.';
      }
      return {color, text};
    }

    document.getElementById('calculate').addEventListener('click', ()=>{
      const values = {
        income: parseFloat(document.getElementById('income').value) || 0,
        partnerIncome: parseFloat(document.getElementById('partnerIncome').value) || 0,
        otherIncome: parseFloat(document.getElementById('otherIncome').value) || 0,
        fixedExpensesGWLIG: parseFloat(document.getElementById('fixedExpensesGWLIG').value) || 0,
        fixedExpensesSubs: parseFloat(document.getElementById('fixedExpensesSubs').value) || 0,
        fixedExpensesFUN: parseFloat(document.getElementById('fixedExpensesFUN').value) || 0,
        debtPayments: parseFloat(document.getElementById('debtPayments').value) || 0,
        savingsGoal: parseFloat(document.getElementById('savingsGoal').value) || 0,
        desiredShare: parseFloat(document.getElementById('desiredShare').value) || 33
      };

      const res = compute(values);
      document.getElementById('totalIncome').textContent = formatEur(res.totalIncome);
      document.getElementById('recommendedRent').textContent = formatEur(res.recommended);

      const lang = currentLang;
      document.getElementById('calcDetail1').textContent = lang==='en'
        ? `Rent based on ${values.desiredShare}% of income: ${formatEur(res.rentByIncome)}.`
        : `Huur op basis van ${values.desiredShare}% van inkomen: ${formatEur(res.rentByIncome)}.`;
      document.getElementById('calcDetail2').textContent = lang==='en'
        ? `Available after expenses and savings: ${formatEur(res.disposable)}; 50% usable for rent → ${formatEur(res.rentByDisposable)}.`
        : `Beschikbaar na lasten en spaargeld: ${formatEur(res.disposable)}; 50% bruikbaar voor huur → ${formatEur(res.rentByDisposable)}.`;
      document.getElementById('calcDetail3').textContent = lang==='en'
        ? `Advice (conservative): choose the lowest of the two calculations → ${formatEur(res.recommended)}.`
        : `Advies (conservatief): kies de laagste van de twee berekeningen → ${formatEur(res.recommended)}.`;

      const risk = getRiskColorAndText(res.recommended, lang);
      document.getElementById('riskBar').style.background = risk.color;
      document.getElementById('riskBar').style.width = '100%';
      document.getElementById('riskText').textContent = risk.text;

      document.getElementById('resultArea').hidden = false;
    });

    document.getElementById('reset').addEventListener('click', ()=>{
      document.getElementById('calcForm').reset();
      document.getElementById('resultArea').hidden = true;
      document.getElementById('riskBar').style.width = '100%';
      document.getElementById('riskBar').style.background = 'green';
      document.getElementById('riskText').textContent = '';
    });

    // Init page in Dutch
    translatePage('nl');
  </script>
</body>
</html>
